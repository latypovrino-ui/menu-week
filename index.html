<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Меню на неделю для семьи</title><style>
:root{--g:#2e7d4f;--g2:#3fa06a;--bg:#f4f7f4;--card:#fff;--txt:#22301f;--muted:#6b7f6e;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
header{background:linear-gradient(135deg,#2e7d4f,#1b5e3a);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.hwrap{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:1.25em;font-weight:700}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav button{background:rgba(255,255,255,.14);border:none;color:#fff;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:.92em;transition:.2s}
nav button:hover{background:rgba(255,255,255,.28)}
nav button.act{background:#fff;color:var(--g);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.err{background:#b71c1c;color:#fff;padding:10px 14px;border-radius:10px;margin:10px auto;max-width:1000px;font-size:.9em;white-space:pre-wrap;display:none}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:0 2px 12px rgba(30,60,30,.08);margin-bottom:16px;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
h1{font-size:1.5em;margin-bottom:6px}
h2{font-size:1.25em;margin-bottom:12px;color:var(--g)}
.sub{color:var(--muted);font-size:.95em}
.btn{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border:none;padding:11px 22px;border-radius:24px;font-size:1em;cursor:pointer;transition:.2s;font-weight:600}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(46,125,79,.35)}
.btn.sec{background:#e8f2ea;color:var(--g)}
.btn.sm{padding:6px 14px;font-size:.88em}
.dots{display:flex;gap:8px;justify-content:center;margin:14px 0}
.dot{width:10px;height:10px;border-radius:50%;background:#cfe0d3;transition:.2s}
.dot.on{background:var(--g);transform:scale(1.25)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.opt{display:flex;align-items:center;gap:10px;background:#f7faf7;border:2px solid #e2ede4;border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--g2)}
.opt.sel{border-color:var(--g);background:#eef7f0}
.opt input{accent-color:var(--g);width:18px;height:18px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:36px;height:36px;border-radius:50%;border:2px solid var(--g);background:#fff;color:var(--g);font-size:1.2em;cursor:pointer;font-weight:700}
.stepper span{min-width:26px;text-align:center;font-weight:700;font-size:1.15em}
.day{margin-bottom:18px}
.dtitle{font-weight:700;color:var(--g);margin-bottom:8px}
.meal{display:flex;align-items:center;gap:10px;background:#f7faf7;border-radius:12px;padding:10px;margin-bottom:8px;flex-wrap:wrap}
.meal img{width:56px;height:44px;object-fit:cover;border-radius:8px;flex:none}
.badge{font-size:.75em;padding:3px 9px;border-radius:10px;color:#fff;flex:none}
.b-b{background:#e8a213}.b-l{background:#3b82d6}.b-d{background:#8b5cf6}
.mname{font-weight:600;cursor:pointer;flex:1}
.mname:hover{text-decoration:underline}
select{padding:7px 10px;border-radius:10px;border:1.5px solid #cfe0d3;background:#fff;font-size:.9em;max-width:180px}
.chk{width:20px;height:20px;accent-color:var(--g);cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:.95em}
th{background:#eef7f0;color:var(--g);text-align:left;padding:9px 10px}
td{padding:9px 10px;border-bottom:1px solid #eef1ee}
tr:hover td{background:#f7faf7}
.tag{font-size:.75em;background:#eef7f0;color:var(--g);padding:3px 9px;border-radius:10px;margin-right:4px;display:inline-block}
.bar{height:14px;background:#e5eee6;border-radius:8px;overflow:hidden;margin:8px 0}
.bar div{height:100%;border-radius:8px;transition:.4s}
.rimg{width:100%;height:220px;object-fit:cover;border-radius:12px;margin:10px 0}
.step{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
.snum{flex:none;width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(20,40,25,.55);display:none;overflow:auto;z-index:100;padding:20px}
.modal .card{max-width:720px;margin:20px auto}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,40,25,.6);z-index:200}
.overlay .card{max-width:400px;text-align:center}
.big{font-size:2.2em}
.price{font-weight:700;white-space:nowrap}
.mini{color:var(--muted);font-size:.85em}
.hint{color:#1b5e3a;font-size:.85em;margin-top:2px}
.storebadge{font-size:.75em;background:#eef7f0;color:var(--g);padding:2px 8px;border-radius:8px;font-weight:600}
.tip{background:#f2f8f3;border-left:4px solid var(--g);padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:10px}
footer{text-align:center;color:var(--muted);padding:20px;font-size:.88em}
#printArea{display:none}
@media print{
 body *{visibility:hidden}
 #printArea,#printArea *{visibility:visible}
 #printArea{display:block;position:absolute;top:0;left:0;width:100%;font-family:Georgia,serif;color:#111}
 header,main,.modal,footer,.err{display:none!important}
 .phead{border:4px double #2e7d4f;border-radius:8px;padding:14px;text-align:center;margin-bottom:16px}
 .phead h1{font-size:1.5em;color:#1b5e3a;margin:0}
 .phead .sub{color:#444;margin-top:4px}
 table.pt{width:100%;border-collapse:collapse;font-size:13pt;margin-bottom:20px}
 table.pt th{border:1.5px solid #333;background:#eef5ef!important;color:#1b5e3a;padding:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 table.pt td{border:1.5px solid #333;padding:8px}
 .pitem{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed #999;font-size:13pt}
 .pbox{width:16px;height:16px;border:2px solid #333;flex:none}
 .pfoot{text-align:center;color:#2e7d4f;font-style:italic;margin-top:18px;font-size:12pt}
 .pimg{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin:10px 0;border:1px solid #ccc}
 .psec{font-size:14pt;font-weight:bold;color:#1b5e3a;border-bottom:2px solid #2e7d4f;margin:16px 0 10px;padding-bottom:4px}
 .pstep{margin-bottom:8px;font-size:12.5pt}
}
@media(max-width:600px){nav{margin-left:0;width:100%}.grid{grid-template-columns:1fr}select{max-width:100%}}
</style></head>

<div class="err" id="errbox"></div>
<header><div class="hwrap"><span class="brand">🌿 Меню недели</span>
<nav id="nav"></nav></div></header>
<main>
 <section id="sec-wizard"></section>
 <section id="sec-menu" hidden></section>

</main>
<footer>Работает офлайн · настройки хранятся в вашем браузере</footer>

<div id="printArea"></div>

": "10 мин", "kcal": 210, "needs": null, "tags": ["dairy", "gluten", "sugar"], "ing": {"овсяные хлопья": 0.08, "молоко": 0.2, "яблоки": 0.15, "сахар": 0.02, "масло сливочное": 0.01}, "desc": "Тёплый завтрак за 10 минут: хлопья томятся в молоке, яблоко даёт мягкую сладость.", "steps": ["Молоко доведите до кипения на среднем огне, помешивая.", "Всыпьте хлопья, убавьте огонь до минимума.", "Варите 5–7 минут, помешивая ложкой каждые пару минут — каша не должна прилипать.", "Яблоко натрите на крупной тёрке или нарежьте мелкими кубиками.", "Снимите с огня, вмешайте яблоко, сахар и кусочек масла.", "Накройте крышкой на 2 минуты — каша дойдёт и станет нежнее."], "img": "Blandat havregrynsgröt (2).jpg"}, {"id": 1, "n": "Оладьи на кефире", "e": "🥞", "t": "b", "time": "20 мин", "kcal": 280, "needs": null, "tags": ["dairy", "eggs", "gluten", "sugar"], "ing": {"мука": 0.12, "кефир": 0.15, "яйца": 1, "сахар": 0.02, "масло растительное": 0.02}, "desc": "Пышные оладьи: тесто на кефире поднимается содой без дрожжей.", "steps": ["Кефир слегка подогрейте (тёплый, не горячий) — так оладьи будут пышнее.", "Вбейте яйцо, добавьте сахар, щепотку соли и соду на кончике ножа.", "Всыпьте муку и размешивайте до густоты сметаны — комочки допустимы, но тесто не взбивайте.", "Оставьте тесто на 5 минут: оно начнёт пузыриться.", "Разогрейте масло на сковороде на среднем огне. Выкладывайте ложкой, не размазывая.", "Жарьте по 2 минуты с каждой стороны до золотистого цвета. Подавайте со сметаной или вареньем."], "img": "Oladushki.jpg"}, {"id": 2, "n": "Блины", "e": "🥞", "t": "b", "time": "30 мин", "kcal": 250, "needs": null, "tags": ["dairy", "eggs", "gluten", "sugar"], "ing": {"молоко": 0.25, "мука": 0.1, "яйца": 1, "сахар": 0.02, "масло растительное": 0.03}, "desc": "Тонкие блины на молоке — с вареньем, творогом или просто так.", "steps": ["Взбейте яйцо с сахаром и щепоткой соли венчиком.", "Влейте половину молока, всыпьте муку и размешайте до однородности без комков.", "Добавьте оставшееся молоко и /* ---------- МАСТЕР ---------- */
let wstep=1,wdraft=null;
function newDraft(){return {stores:["Чижик"],budget:1500,all:[],prefs:[],home:[],fam:{a:2,t:0,c:0,i:0},kit:{oven:false,mw:false,mc:false,blender:false}};}
function renderWizard(){
 if(!wdraft)wdraft=S?JSON.parse(JSON.stringify(S)):newDraft();
 var el=document.getElementById("sec-wizard"),h='<div class="card"><h1>Мастер настройки</h1><p class="sub">Шаг '+wstep+' из 5</p><div class="dots">';

  STORES.forEach(function(s){h+='<label class="opt'+(wdraft.stores.indexOf(s[0])>=0?" sel":"")+'"><input type="checkbox" '+(wdraft.stores.indexOf(s[0])>=0?"checked":"")+' onchange="tog(''+s[0]+'','stores')"><b>'+s[0]+'</b></label>';});
  h+='</div><p class="mini" style="margin-top:10px">💡 В Зубово есть четыре «Монетки», «Чижик», «Магнит», «Находка» и «Байрам» — «Монетка» и «Чижик» обычно дешевле всего.</p>';}
 if(wstep===2){h+='<h2>Бюджет на неделю</h2><p class="sub">Ориентир: 1000–1500 ₽ на человека в неделю на домашнюю готовку.</p><input type="number" id="budgetIn" value="'+wdraft.budget+'" min="300" step="100" style="width:160px;padding:10px;border-radius:10px;border:1.5px solid #cfe0d3;font-size:1.2em;margin-top:12px"> ₽';}
 if(wstep===3){h+='<h2>Аллергии и предпочтения</h2><div class="grid" style="margin-top:12px">';
  ALL.forEach(function(a){h+='<label class="opt'+(wdraft.all.indexOf(a[0])>=0?" sel":"")+'"><input type="checkbox" '+(wdraft.all.indexOf(a[0])>=0?"checked":"")+' onchange="tog(''+a[0]+'','all')"><span><b>Без '+a[0]+'</b></span></label>';});
  PREFS.forEach(function(p){h+='<label class="opt'+(wdraft.prefs.indexOf(p)>=0?" sel":"")+'"><input type="checkbox" '+(wdraft.prefs.indexOf(p)>=0?"checked":"")+' onchange="tog(''+p+'','prefs')"><b>'+p+'</b></label>';});
  h+='</div>';}
 if(wstep===4){h+='<h2>Что уже есть дома?</h2><p class="sub">Эти продукты не попадут в список покупок.</p><div class="grid" style="margin-top:12px">';
  Object.keys(P).forEach(function(p){if(p.indexOf("детск")===0)return;h+='<label class="opt'+(wdraft.home.indexOf(p)>=0?" sel":"")+'"><input type="checkbox" '+(wdraft.home.indexOf(p)>=0?"checked":"")+' onchange="tog(''+p+'','home')">'+p+'</label>';});
  h+='</div>';}
 if(wstep===5){h+='<h2>Состав семьи и кухня</h2>';
  var rows=[["a","Взрослые"],["t","Подростки"],["c","Дети 1–6 лет"],["i","Младенцы до года"]];
  rows.forEach(function(r){h+='<div class="stepper" style="margin:12px 0"><button onclick="fam(''+r[0]+'',-1)">−</button><span>'+wdraft.fam[r[0]]+'</span><button onclick="fam(''+r[0]+'',1)">+</button><span>'+r[1]+'</span></div>';});
  h+='<p class="sub" style="margin:12px 0 6px">Кухонная техника (блюда, требующие техники, не попадут в меню):</p><div class="grid">';
  var kitn={oven:"Духовка",mw:"Микроволновка",mc:"Мультиварка",blender:"Блендер"};
  Object.keys(kitn).forEach(function(k){h+='<label class="opt'+(wdraft.kit[k]?" sel":"")+'"><input type="checkbox" '+(wdraft.kit[k]?"checked":"")+' onchange="wdraft.kit.'+k+'=!wdraft.kit.'+k+';this.closest('.opt').classList.toggle('sel')">'+kitn[k]+'</label>';});
  h+='</div><p class="mini">Для младенцев в список покупок добавится прикорм: детское пюре, каша и творожки.</p>';}
 h+='<div style="margin-top:18px;display:flex;gap:10px;justify-content:space-between">';
 if(wstep>1)h+='<button class="btn sec" onclick="wstep--;renderWizard()">← Назад</button>';
 else h+='<span></span>';

function tog(name,key){var arr=wdraft[key],i=arr.indexOf(name);
 if(i>=0)arr.splice(i,1);else arr.push(name);renderWizard();}
function fam(k,d){wdraft.fam[k]=Math.max(0,wdraft.fam[k]+d);renderWizard();}
function wnext(){

/* ---------- ПОДБОР МЕНЮ ---------- */
function pool(mt){return R.filter(function(r){return r.t===mt;});}
function pass(r){ // фильтры: аллергии + техника
 for(var i=0;i<S.all.length;i++){var a=ALL.filter(function(x){return x[0]===S.all[i];})[0];
  if(!a)continue;var prods=a[1].split(",");
  for(var p of prods)if(r.ing[p]!==undefined)return false;}
 if(r.needs==="oven"&&!S.kit.oven)return false;
 if(r.needs==="blender"&&!S.kit.blender)return false;
 return true;}
function genMenu(){
 menu={days:[]};
 var used={},meatCount=0,quota=S.prefs.indexOf("меньше мяса")>=0?4:99;
 var cost={};R.forEach(function(r){var c=0;for(var p in r.ing)c+=r.ing[p]*P[p].price;cost[r.id]=c;});
 for(var d=0;d<7;d++){var day={};
  MEALS.forEach(function(m){var mt=m[0];
   var pl=pool(mt).filter(pass);
   if(!pl.length)pl=pool(mt).filter(function(r){return !(r.needs&&!S.kit[r.needs]);}); // отступление по технике
   if(!pl.length)pl=pool(mt); // отступление по аллергиям (с подсказкой)
   var av=pl.filter(function(r){return !used[r.id];});
   if(!av.length)av=pl;
   if(quota<99){var nm=av.filter(function(r){return r.tags.indexOf("meat")<0;});if(nm.length&&meatCount>=quota)av=nm;}
   if(S.prefs.indexOf("быстро готовить")>=0)av.sort(function(x,y){return x.time.localeCompare(y.time);});
   if(S.prefs.indexOf("максимально экономно")>=0)av.sort(function(x,y){return cost[x.id]-cost[y.id];});
   var pick=av[Math.floor(Math.random()*Math.min(av.length,4))];
   if(av.length&&Math.random()<0.5)pick=av[Math.floor(Math.random()*av.length)];
   used[pick.id]=true;if(pick.tags.indexOf("meat")>=0)meatCount++;
   day[mt]={id:pick.id,done:true};});
  menu.days.push(day);}
 save();}

function renderMenu(){
 var el=document.getElementById("sec-menu");
 if(!S||!menu){el.innerHTML='<div class="card"><h1>Сначала настройка</h1><p class="sub">Пройдите мастер — и меню появится здесь.</p><br><button class="btn" onclick="go('wizard')">⚙ Пройти настройку</button></div>';return;}
 var h='<div class="card"><h1>Меню на неделю</h1><p class="sub">Сняли галочку — блюдо уходит из списка покупок. Нажмите на название, чтобы открыть рецепт. Выпадающий список меняет блюдо.</p><br><button class="btn sec" onclick="genMenu();renderMenu();">↻ Сгенерировать заново</button> <button class="btn sec" onclick="printMenu()">🖨 Печать на холодильник</button></div>';
 menu.days.forEach(function(day,di){
  h+='<div class="card"><div class="dtitle">'+DAYS[di]+'</div>';
  MEALS.forEach(function(m){var mt=m[0],mm=day[mt],r=byId(mm.id);
   var opts="";pool(mt).forEach(function(x){opts+='<option value="'+x.id+'"'+(x.id===mm.id?" selected":"")+'>'+esc(x.n)+'</option>';});
   h+='<div class="meal"><span class="badge '+MEALB[mt]+'">'+m[1]+'</span>';
   h+='<img src="'+img(r)+'" onerror="this.style.display='none'" alt="">';
   h+='<span class="mname" onclick="openRecipe('+r.id+')">'+r.e+' '+esc(r.n)+'</span>';
   h+='<span class="mini">'+r.time+' · '+r.kcal+' ккал</span>';
   h+='<select onchange="changeDish('+di+',''+mt+'',this.value)">'+opts+'</select>';
   h+='<input type="checkbox" class="chk" title="готовим" '+(mm.done?"checked":"")+' onchange="menu.days['+di+'].'+mt+'.done=this.checked;save();"></div>';});
  h+='</div>';});
 el.innerHTML=h;}
function changeDish(di,mt,id){id=parseInt(id);menu.days[di][mt].id=id;menu.days[di][mt].done=true;save();renderMenu();}

/* ---------- СПИСОК ПОКУПОК ---------- */
function servings(){var f=S.fam;return f.a+f.t*0.75+f.c*0.5;}
function shopList(){
 var need={},baby=[];
 for(var d=0;d<7;d++)MEALS.forEach(function(m){var mt=m[0],mm=menu.days[d][mt];if(!mm.done)return;
  var r=byId(mm.id);for(var p in r.ing)need[p]=(need[p]||0)+r.ing[p];});
 var SE=servings(),rows=[];
 for(var p in need){var q=Math.ceil(need[p]*SE*20)/20;
  var home=S.home.indexOf(p)>=0;
  var prices=STORES.filter(function(s){return S.stores.indexOf(s[0])>=0;}).map(function(s){return {st:s[0],pr:P[p].price*s[1]};});
  if(!prices.length)prices=STORES.map(function(s){return {st:s[0],pr:P[p].price*s[1]};});
  prices.sort(function(a,b){return a.pr-b.pr;});
  rows.push({p:p,q:q,unit:P[p].unit,best:prices[0],alt:prices.length>1?prices[1]:null,home:home,total:home?0:prices[0].pr*q});}
 rows.sort(function(a,b){return b.total-a.total;});
 if(S.fam.i>0){baby=[["детское пюре",S.fam.i*10,"шт"],["детская каша",S.fam.i*1,"уп"],["детский творожок",S.fam.i*5,"шт"]];}
 return {rows:rows,baby:baby};}
function totalAll(sl){var t=0;sl.rows.forEach(function(r){t+=r.total;});sl.baby.forEach(function(b){t+=P[b[0]].price*b[1];});return t;}
function renderShop(){
 var el=document.getElementById("sec-shop");
 if(!S||!menu){el.innerHTML='<div class="card"><h1>Сначала настройка</h1><br><button class="btn" onclick="go('wizard')">⚙ Пройти настройку</button></div>';return;}
 var sl=shopList(),t=totalAll(sl);
 var h='<div class="card"><h1>🛒 Список покупок</h1><p class="sub">Цены — из самого дешёвого из выбранных вами магазинов. Под строкой — где ещё дешевле.</p>';
 h+='<p style="margin-top:8px">Итого: <b class="price">'+money(t)+'</b></p></div>';
 if(!sl.rows.length)h+='<div class="card"><p>Список пуст — отметьте блюда в меню.</p></div>';
 else{h+='<div class="card"><table><tr><th>Продукт</th><th>Кол-во</th><th>Где дешевле</th><th>Цена</th><th>Сумма</th></tr>';
  sl.rows.forEach(function(r){
   var hint="";
   if(r.home)hint='<div class="hint">✔ есть дома</div>';
   else if(r.alt)hint='<div class="hint">в '+r.alt.st+' — '+money(r.alt.pr*r.q)+' ('+(r.alt.pr>r.best.pr?"+":"")+money(Math.round(r.alt.pr*r.q-r.best.pr*r.q))+')</div>';
   h+='<tr><td>'+esc(r.p)+'</td><td>'+(r.q+" "+r.unit)+'</td><td>'+(r.home?'<span class="mini">дома</span>':'<span class="storebadge">'+r.best.st+'</span>')+'</td><td class="price">'+(r.home?"—":money(r.best.pr)+"/"+r.unit)+'</td><td class="price">'+money(r.total)+'</td></tr><tr><td colspan="5" style="border:none;padding:0 10px 4px">'+hint+'</td></tr>';});
  h+='</table></div>';}
 if(sl.baby.length){h+='<div class="card"><h2>🍼 Прикорм для младенцев</h2><table><tr><th>Продукт</th><th>Кол-во</th><th>Цена</th><th>Сумма</th></tr>';
  sl.baby.forEach(function(b){h+='<tr><td>'+b[0]+'</td><td>'+b[1]+" "+b[2]+'</td><td class="price">'+money(P[b[0]].price)+"/"+b[2]+'</td><td class="price">'+money(P[b[0]].price*b[1])+'</td></tr>';});
  h+='</table></div>';}
 h+='<div class="card"><button class="btn" onclick="printShopping()">🖨 Печать списка покупок</button></div>';
 el.innerHTML=h;}

/* ---------- БЮДЖЕТ ---------- */
function renderBudget(){
 var el=document.getElementById("sec-budget");
 if(!S||!menu){el.innerHTML='<div class="card"><h1>Сначала настройка</h1><br><button class="btn" onclick="go('wizard')">⚙ Пройти настройку</button></div>';return;}
 var sl=shopList(),t=totalAll(sl),B=S.budget,pc=Math.min(100,t/B*100);
 var col=pc<=100?"linear-gradient(90deg,#3fa06a,#2e7d4f)":pc<=115?"#e8a213":"#c0392b";
 var h='<div class="card"><h1>💰 Бюджет недели</h1>';
 h+='<p>Корзина: <b class="price">'+money(t)+'</b> из '+money(B)+'</p><div class="bar"><div style="width:'+pc+'%;background:'+col+'"></div></div>';
 h+='<p class="sub">'+(t<=B?"Остаток: "+money(B-t)+" — можно отложить на что-то вкусное 🙂":"Перебор: "+money(t-B)+". Снимите галочку с пары блюд в меню или замените дорогие обеды экономными.")+'</p></div>';
 var cmp=STORES.filter(function(s){return S.stores.indexOf(s[0])>=0;}).map(function(s){var sum=0;sl.rows.forEach(function(r){sum+=r.q*P[r.p].price*s[1];});return {st:s[0],sum:sum};});
 cmp.sort(function(a,b){return a.sum-b.sum;});
 var best=cmp.length?cmp[0].sum:t, saving=t-best;
 h+='<div class="card"><h2>Сравнение магазинов</h2><table><tr><th>Магазин</th><th>Вся корзина</th></tr>';
 cmp.forEach(function(c,i){h+='<tr><td>'+c.st+(i===0?" 👑":"")+'</td><td class="price">'+money(c.sum)+'</td></tr>';});
 h+='</table>';
 if(cmp.length>1)h+='<p class="tip" style="margin-top:12px">Если брать каждый товар там, где он дешевле, корзина обойдётся в <b>'+money(t)+'</b> — самая дешёвая единая корзина: <b>'+money(best)+'</b>. Экономия от «рассыпчатой» покупки: <b>'+money(Math.max(0,saving))+'</b>.</p>';
 h+='</div>';
 el.innerHTML=h;}

/* ---------- СОВЕТЫ ---------- */
function renderAdvice(){
 var el=document.getElementById("sec-adv");
 if(!S||!menu){el.innerHTML='<div class="card"><h1>Сначала настройка</h1><br><button class="btn" onclick="go('wizard')">⚙ Пройти настройку</button></div>';return;}
 var sl=shopList(),t=totalAll(sl),tips=[];
 var cmp=STORES.filter(function(s){return S.stores.indexOf(s[0])>=0;}).map(function(s){var sum=0;sl.rows.forEach(function(r){sum+=r.q*P[r.p].price*s[1];});return {st:s[0],sum:sum};});
 cmp.sort(function(a,b){return a.sum-b.sum;});
 if(cmp.length>1){tips.push("👑 Вся корзина целиком дешевле всего в «"+cmp[0].st+"» — "+money(cmp[0].sum)+". Это на "+money(cmp[cmp.length-1].sum-cmp[0].sum)+" дешевле, чем в «"+cmp[cmp.length-1].st+"».");tips.push("🧮 Покупая каждый товар там, где он дешевле, вы экономите "+money(Math.max(0,t-cmp[0].sum))+" против самой дешёвой единой корзины — но придётся ходить в несколько мест.");}
 if(t<=S.budget)tips.push("💰 Бюджет в плюсе: остаток "+money(S.budget-t)+". Хватит на шарлотку к воскресному чаепитию 🙂");
 else tips.push("⚠ Перебор бюджета на "+money(t-S.budget)+". Замените пару обедов на «Гороховый суп» или «Тушёную капусту с сосисками» — они самые дешёвые.");
 var homeN=S.home.length;if(homeN)tips.push("🏠 Учтено домашних запасов: "+homeN+" продуктов — это уже вычтено из списка.");
 if(S.fam.i>0)tips.push("🍼 Для младенцев добавлен прикорм: пюре, каша и творожки на неделю.");
 if(S.prefs.indexOf("меньше мяса")>=0)tips.push("🌱 Меньше мяса: в меню не больше 4 мясных блюд за неделю.");
 if(S.all.length)tips.push("🚫 Исключены аллергены: "+S.all.join(", ")+". Блюд с ними в меню нет.");
 if(S.prefs.indexOf("максимально экономно")>=0)tips.push("🪙 Включён экономный режим: при подборе блюд приоритет у дешёвых.");
 var h='<div class="card"><h1>💡 Советы</h1><button class="btn sec sm" style="float:right" onclick="renderAdvice()">↻ Обновить</button><div style="clear:both"></div>';
 tips.forEach(function(x){h+='<div class="tip">'+x+'</div>';});
 h+='</div>';el.innerHTML=h;}

/* ---------- РЕЦЕПТ ---------- */
function openRecipe(id){var r=byId(id),SE=servings();
 var h='<div class="card"><button class="btn sm sec" style="float:right" onclick="closeModal()">✕</button><h1>'+r.e+' '+esc(r.n)+'</h1><p class="sub">'+r.time+' · '+r.kcal+' ккал на порцию'+(r.needs?" · нужна "+(r.needs==="oven"?"духовка":"блендер"):"")+'</p>';
 h+='<img class="rimg" src="'+img(r)+'" onerror="this.style.display='none'">';
 h+='<p>'+esc(r.desc)+'</p><h2 style="margin-top:14px">Ингредиенты <span class="mini">(на '+SE.toFixed(1).replace(".",",")+' порций)</span></h2>';
 for(var p in r.ing){var q=Math.ceil(r.ing[p]*SE*20)/20;h+='<div class="pitem" style="display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed #d8e5da"><span class="pbox" style="width:15px;height:15px;border:1.5px solid #888;flex:none"></span><span>'+esc(p)+' — '+q+" "+P[p].unit+'</span></div>';}
 h+='<h2 style="margin-top:14px">Приготовление</h2>';
 r.steps.forEach(function(s,i){h+='<div class="step"><div class="snum">'+(i+1)+'</div><div>'+esc(s)+'</div></div>';});
 h+='<div style="margin-top:14px;display:flex;gap:10px"><button class="btn" onclick="printRecipe('+r.id+')">🖨 Печать рецепта</button><button class="btn sec" onclick="closeModal()">Закрыть</button></div></div>';
 document.getElementById("modal").style.display="block";document.getElementById("modal").innerHTML=h;}
function closeModal(){document.getElementById("modal").style.display="none";}

/* ---------- ПЕЧАТЬ ---------- */
function fillPrint(html){document.getElementById("printArea").innerHTML=html;window.print();}
function printMenu(){
 if(!S||!menu){alert("Сначала сгенерируйте меню");return;}
 var h='<div class="phead"><h1>🌿 Меню на неделю</h1><div class="sub">Ключевые блюда недели · повесьте на холодильник</div></div>';
 h+='<table class="pt"><tr><th>День</th><th>Завтрак</th><th>Обед</th><th>Ужин</th></tr>';
 menu.days.forEach(function(day,di){h+='<tr><td><b>'+DAYS[di]+'</b></td>';
  MEALS.forEach(function(m){var mt=m[0],mm=day[mt],r=byId(mm.id);
   h+='<td'+(mm.done?"":' style="text-decoration:line-through;color:#999"')+'>'+r.e+' '+esc(r.n)+'</td>';});
  h+='</tr>';});
 h+='</table>';
 var sl=shopList(),t=totalAll(sl);
 h+='<div class="psec">🛒 Список покупок — '+money(t)+'</div>';
 sl.rows.forEach(function(r){h+='<div class="pitem"><span class="pbox"></span><span>'+esc(r.p)+'</span><span style="margin-left:auto">'+(r.q+" "+r.unit)+(r.home?" (дома)":"")+'</span></div>';});
 sl.baby.forEach(function(b){h+='<div class="pitem"><span class="pbox"></span><span>'+b[0]+'</span><span style="margin-left:auto">'+(b[1]+" "+b[2])+'</span></div>';});
 h+='<div class="pfoot">Приятного аппетита! 🌿</div>';
 fillPrint(h);}
function printShopping(){if(!S||!menu){alert("Сначала сгенерируйте меню");return;}
 var sl=shopList(),t=totalAll(sl);
 var h='<div class="phead"><h1>🛒 Список покупок</h1><div class="sub">Итого: '+money(t)+'</div></div>';
 sl.rows.forEach(function(r){h+='<div class="pitem"><span class="pbox"></span><span>'+esc(r.p)+'</span><span style="margin-left:auto">'+(r.q+" "+r.unit)+(r.home?" (дома)":"")+'</span></div>';});
 sl.baby.forEach(function(b){h+='<div class="pitem"><span class="pbox"></span><span>'+b[0]+'</span><span style="margin-left:auto">'+(b[1]+" "+b[2])+'</span></div>';});
 h+='<div class="pfoot">Приятного аппетита! 🌿</div>';
 fillPrint(h);}
function printRecipe(id){var r=byId(id),SE=servings();
 var h='<div class="phead"><h1>'+r.e+' '+esc(r.n)+'</h1><div class="sub">'+r.time+' · '+r.kcal+' ккал на порцию</div></div>';
 h+='<img class="pimg" src="'+img(r)+'" onerror="this.style.display='none'">';
 h+='<div class="psec">Ингредиенты ('+SE.toFixed(1).replace(".",",")+' порций)</div>';
 for(var p in r.ing){var q=Math.ceil(r.ing[p]*SE*20)/20;h+='<div class="pitem"><span class="pbox"></span><span>'+esc(p)+'</span><span style="margin-left:auto">'+q+" "+P[p].unit+'</span></div>';}
 h+='<div class="psec">Приготовление</div>';
 r.steps.forEach(function(s,i){h+='<div class="pstep"><b>'+(i+1)+'.</b> '+esc(s)+'</div>';});
 h+='<div class="pfoot">Приятного аппетита! 🌿</div>';
 closeModal();fillPrint(h);}

/* ---------- СТАРТ ---------- */
if(S&&S.done&&menu){go("menu");}else{go("wizard");}
</script></body></html>
