<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Питание — меню на неделю</title>
<style>
:root{--g:#2e7d32;--gl:#e8f5e9;--o:#ef6c00;--bg:#f6f7f4;--card:#ffffff;--tx:#263238;--mut:#78909c;--line:#e0e4dc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
.top{position:sticky;top:0;z-index:10;background:var(--g);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.top b{font-size:18px}
.top .note{font-size:12px;opacity:.85;margin-left:auto}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h1{font-size:22px;margin-bottom:10px}
h2{font-size:18px;margin:0 0 10px;color:var(--g)}
h3{font-size:15px;margin:12px 0 6px}
button{background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer;font-family:inherit}
button.sec{background:#fff;color:var(--g);border:1.5px solid var(--g)}
button.ghost{background:#f0f2ee;color:var(--tx);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1.5px solid var(--line);border-radius:20px;cursor:pointer;user-select:none;font-size:14px;background:#fff}
.chip.on{border-color:var(--g);background:var(--gl);color:var(--g);font-weight:600}
input[type=number],input[type=text],select{padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;width:100%}
label{display:block;font-size:14px;margin:10px 0 4px;color:var(--mut)}
.meal{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#fbfcfa}
.meal .mt{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--o);font-weight:700;margin-bottom:4px}
.day h3{color:var(--g)}
select.dish{margin-top:6px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.rp{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:#fff}
.rp:hover{border-color:var(--g);box-shadow:0 2px 8px rgba(46,125,50,.12)}
.rp .rn{font-weight:700;margin-bottom:4px}
.rp .rm{font-size:13px;color:var(--mut)}
.badge{display:inline-block;font-size:11px;background:var(--gl);color:var(--g);border-radius:10px;padding:2px 8px;margin:2px 4px 0 0}
.item{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item .nm{font-weight:600;min-width:120px}
.item .qt{color:var(--mut);font-size:14px}
.item .pr{margin-left:auto;font-weight:600}
.hint{font-size:12.5px;color:var(--o);width:100%;margin-top:2px}
.bar{height:14px;background:#eee;border-radius:7px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--g)}
.err{display:none;position:fixed;bottom:0;left:0;right:0;background:#b71c1c;color:#fff;padding:12px 16px;font-size:13px;z-index:99;white-space:pre-wrap}
.pill{font-size:13px;background:var(--gl);color:var(--g);border-radius:16px;padding:4px 12px}
.stepnav{display:flex;justify-content:space-between;margin-top:16px}
.step{display:none}
.step.on{display:block}
#steps-nav .dot{width:10px;height:10px;border-radius:50%;background:#cfd8dc;display:inline-block;margin:0 3px}
#steps-nav .dot.on{background:var(--g)}
ol{padding-left:20px}ol li{margin:6px 0}
.prn{display:none}
@media print{
 body{background:#fff;font-family:Georgia,'Times New Roman',serif}
 .top,.wrap>.card,.step,.modal,.nav,.err{display:none!important}
 #prn{display:block!important}
 #prn h1{text-align:center;border:3px double #2e7d32;padding:10px;border-radius:4px}
 #prn table{width:100%;border-collapse:collapse;margin:10px 0}
 #prn th,#prn td{border:1px solid #999;padding:6px 8px;font-size:13px;text-align:left}
 #prn th{background:#e8f5e9}
 #prn .pg{page-break-after:always}
}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;overflow:auto}
.modal.on{display:block}
.mbox{background:#fff;max-width:640px;margin:40px auto;border-radius:14px;padding:20px}
.mbox .x{float:right;background:#f0f2ee;color:var(--tx);border:1px solid var(--line);padding:6px 12px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div class="top"><b>🥗 Питание</b><span class="note">Работает офлайн · настройки хранятся в вашем браузере</span></div>

<div id="prn"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="mbox" id="mbox"></div></div>

var PRICE=DATA.price,SHOPS=DATA.shops,RECIPES=DATA.recipes;
function $(s){return document.querySelector(s)}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function rub(n){return Math.round(n)+" ₽"}

/* ---------- состояние ---------- */
var S={shops:["chizhik","monetka"],budget:5000,allergies:[],prefs:[],have:[],fam:{ad:2,kid:1,bab:0},appl:[],menu:null,done:false};
try{var raw=localStorage.getItem("menu_state");if(raw){var p=JSON.parse(raw);for(var k in p)S[k]=p[k];}}catch(e){}

function save(){try{localStorage.setItem("menu_state",JSON.stringify(S))}catch(e){}}
function portions(){return S.fam.ad+S.fam.kid*0.5+(S.fam.bab>0?0.3:0)}
function shopsOn(){return SHOPS.filter(function(s){return S.shops.indexOf(s.id)>=0})}
function priceIn(p,shopM){return Math.round(PRICE[p]*shopM)}
function bestPrice(p){var bs=null,bv=1e9,vs=[];for(var s of SHOPS){if(S.shops.indexOf(s.id)<0)continue;var v=priceIn(p,s.m);vs.push({s:s,v:v});if(v<bv){bv=v;bs=s}}return{shop:bs,val:bv,all:vs}}
function nameShop(id){for(var s of SHOPS)if(s.id===id)return s.n;return id}
function recipeById(id){for(var r of RECIPES)if(r.n===id)return r;return null}
function eligible(r){
  if(r.oven&&S.appl.indexOf("oven")<0)return false;
  if(S.allergies.indexOf("milk")>=0&&r.ing.some(function(i){return i[0].indexOf("молоко")>=0||i[0]==="кефир"||i[0]==="творог"||i[0]==="сметана"||i[0]==="сыр"||i[0]==="масло сливочное"}))return false;
  if(S.allergies.indexOf("egg")>=0&&r.ing.some(function(i){return i[0]==="яйца"}))return false;
  if(S.allergies.indexOf("meat")>=0&&r.ing.some(function(i){return ["говядина","курица","фарш","сосиски","ветчина","рыба (минтай)"].indexOf(i[0])>=0}))return false;
  return true;
}
function pool(cat){
  var p=RECIPES.filter(function(r){return r.c===cat&&eligible(r)});
  if(S.prefs.indexOf("light")>=0)p=p.sort(function(a,b){return a.k-b.k});
  return p;
}

var DAYS=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
function genMenu(){
  var m=[];
  var pools={};
  var cats=["завтрак","обед","ужин","полдник"];
  for(var c of cats)pools[c]=pool(c).map(function(r){return r.n}).sort(function(){return Math.random()-0.5});
  if(S.prefs.indexOf("meatlove")>=0)pools["обед"].sort(function(a,b){var x=recipeById(b).ing.some(function(i){return i[0].indexOf("курица")>=0||i[0]==="говядина"||i[0]==="фарш"}),y=recipeById(a).ing.some(function(i){return i[0].indexOf("курица")>=0||i[0]==="говядина"||i[0]==="фарш"});return (x?1:0)-(y?1:0)});
  var idx={завтрак:0,обед:0,ужин:0,полдник:0};
  for(var d=0;d<7;d++){
    var day={};
    for(var c of cats){
      var pl=pools[c];
      if(!pl.length){day[c]=null;continue}
      day[c]=pl[idx[c]%pl.length];idx[c]++;
    }
    m.push(day);
  }
  S.menu=m;S.done=true;save();
}
function viewMenu(){
  if(!S.menu)genMenu();
  var h='<div class="card"><div class="row" style="justify-content:space-between"><h2>📅 Меню на неделю</h2><div class="row"><button class="sec" data-act="shop">Список покупок →</button><button class="ghost" data-act="regen">↻ Заново</button></div></div>';
  for(var d=0;d<7;d++){
    h+='<div class="day"><h3>'+DAYS[d]+'</h3>';
    var lbl={завтрак:"Завтрак",обед:"Обед",ужин:"Ужин",полдник:"Полдник"};
    for(var c of ["завтрак","обед","ужин","полдник"]){
      var v=S.menu[d][c];
      if(!v){h+='<div class="meal"><div class="mt">'+lbl[c]+'</div><i style="color:var(--mut);font-size:13px">нет подходящих блюд — проверьте шаг 3 и технику</i></div>';continue}
      var r=recipeById(v);
      if(!r){h+='<div class="meal"><div class="mt">'+lbl[c]+'</div><i style="color:var(--mut);font-size:13px">блюдо недоступно — нажмите ↻ Заново</i></div>';continue}
      h+='<div class="meal"><div class="mt">'+lbl[c]+' · '+r.t+' мин · '+r.k+' ккал</div><b>'+esc(r.n)+'</b>';
      h+='<select class="dish" data-day="'+d+'" data-slot="'+c+'">';
      for(var o of pool(c))h+='<option'+(o.n===v?" selected":"")+'>'+esc(o.n)+'</option>';
      h+='</select><div style="margin-top:6px"><span class="badge" data-act="open" data-v="'+esc(r.n)+'" style="cursor:pointer">📖 Рецепт</span></div></div>';
    }
    h+='</div>';
  }
  h+='<div class="row"><button class="sec" data-act="printmenu">🖨 Меню на холодильник</button><button class="sec" data-act="budget">Бюджет →</button><button class="ghost" data-act="advice">💡 Советы</button></div></div>';
  return h;
}

/* ---------- список покупок ---------- */
function shopping(){
  if(!S.menu)genMenu();
  var agg={};
  for(var d=0;d<7;d++)for(var c of ["завтрак","обед","ужин","полдник"]){
    var v=S.menu[d][c];if(!v)continue;
    var r=recipeById(v);
    for(var i of r.ing){var k=i[0];agg[k]=(agg[k]||0)+i[1]}
  }
  var por=portions();
  var out=[];
  for(var k in agg){
    if(S.have.indexOf(k)>=0)continue;
    var q=Math.ceil(agg[k]*por);
    var unit="шт";
    if(agg[0]===undefined){/* units carried with name */}
    var b=bestPrice(k);
    out.push({n:k,q:q,price:b.val,shop:b.shop?b.shop.n:"—",all:b.all});
  }
  if(S.fam.bab>0){
    out.push({n:"детская каша",q:4,price:bestPrice("соль").val*8,shop:"—",all:[]});
    out.push({n:"пюре в банках",q:4,price:bestPrice("соль").val*5,shop:"—",all:[]});
  }
  return out;
}
function viewShop(){
  var list=shopping();
  var h='<div class="card"><div class="row" style="justify-content:space-between"><h2>🛒 Список покупок</h2><div class="row"><button class="ghost" data-act="back">← Меню</button></div></div>';
  h+='<p style="color:var(--mut);font-size:13px">Порций: '+portions()+' · учтены ваши запасы и выбранные магазины</p>';
  for(var it of list){
    h+='<div class="item"><span class="nm">'+esc(it.n)+'</span><span class="qt">× '+it.q+'</span><span class="pr">'+rub(it.price)+'</span>';
    if(it.all.length>1){
      var alt=it.all.filter(function(a){return a.v>it.price});
      if(alt.length){var m=alt[0];h+='<span class="hint">в '+m.s.n+' этот же товар — '+rub(m.v)+' (+'+(m.v-it.price)+' ₽)</span>'}
    }
    h+='</div>';
  }
  var tot=0;for(var t of list)tot+=t.price*t.q;
  h+='<div class="item" style="border:0;font-size:17px"><span class="nm">Итого (по минимуму)</span><span class="pr"><b>'+rub(tot)+'</b></span></div>';
  h+='<div class="row"><button class="sec" data-act="printshop">🖨 Печать списка</button><button data-act="budget">Бюджет →</button></div></div>';
  return h;
}

/* ---------- бюджет ---------- */
function viewBudget(){
  var list=shopping();
  var tot=0;for(var t of list)tot+=t.price*t.q;
  var h='<div class="card"><div class="row" style="justify-content:space-between"><h2>💰 Бюджет</h2><button class="ghost" data-act="back">← Назад</button></div>';
  var pct=Math.min(100,Math.round(tot/S.budget*100));
  h+='<p>Корзина: <b>'+rub(tot)+'</b> из бюджета <b>'+rub(S.budget)+'</b></p><div class="bar"><i style="width:'+pct+'%;background:'+(tot>S.budget?"#c62828":"var(--g)")+'"></i></div>';
  h+=(tot>S.budget?'<span class="pill" style="background:#ffebee;color:#c62828">Перерасход: '+rub(tot-S.budget)+'</span>':'<span class="pill">Запас: '+rub(S.budget-tot)+'</span>');
  h+='<h3>Сравнение по магазинам</h3>';
  var best=null,bv=1e9;
  for(var s of SHOPS){
    if(S.shops.indexOf(s.id)<0)continue;
    var sum=0;for(var it of list){var pv=1e9;for(var a of it.all)if(a.s.id===s.id)pv=Math.min(pv,a.v);if(pv===1e9)pv=it.price;sum+=pv*it.q}
    if(sum<bv){bv=sum;best=s}
    h+='<div class="item"><span class="nm">'+s.n+'</span><span class="pr">'+rub(sum)+(s.id===best.id?' <span class="badge">выгоднее всех</span>':'')+'</span></div>';
  }
  h+='<p style="margin-top:10px">Если покупать каждый товар там, где он дешевле: <b>'+rub(tot)+'</b>. Сэкономите относительно среднего магазина: <b style="color:var(--g)">'+rub(Math.max(0,Math.round((bv+tot)/2-tot)))+'</b> за неделю.</p>';
  h+='<div class="row"><button class="ghost" data-act="advice">💡 Советы</button></div></div>';
  return h;
}

/* ---------- советы ---------- */
function viewAdvice(){
  var list=shopping(),tot=0;for(var t of list)tot+=t.price*t.q;
  var h='<div class="card"><div class="row" style="justify-content:space-between"><h2>💡 Советы недели</h2><button class="ghost" data-act="back">← Назад</button></div><ol>';
  h+='<li>Дешевле всего закупаться в <b>'+(SHOPS.filter(function(s){return S.shops.indexOf(s.id)>=0}).sort(function(a,b){return a.m-b.m})[0]||SHOPS[0]).n+'</b> — но присматривайтесь к акциям на мясо и молочку: базовые цены могут меняться.</li>';
  if(tot>S.budget)h+='<li>Корзина выбилась из бюджета на '+rub(tot-S.budget)+'. Замените одно мясное блюдо на крупяное — экономия около 300–400 ₽.</li>';
  else h+='<li>У вас запас бюджета '+rub(S.budget-tot)+'. Хорошая неделя, чтобы купить рис или гречку впрок.</li>';
  if(S.allergies.length)h+='<li>Учтены аллергии: '+S.allergies.map(function(a){return{milk:"молочные продукты",egg:"яйца",meat:"мясо"}[a]}).join(", ")+'. Проверяйте состав готовых продуктов.</li>';
  if(S.fam.bab>0)h+='<li>Для младенцев: овощные пюре вводите по одному новому продукту в 3–4 дня, следите за реакцией.</li>';
  h+='<li>Крупы и макароны берите большие упаковки — в пересчёте на грамм выходит заметно дешевле.</li>';
  h+='<li>Мясо и рыбу можно заморозить порционно сразу после покупки — так ничего не пропадёт.</li>';
  h+='</ol></div>';
  return h;
}

/* ---------- рецепт ---------- */
function openRecipe(name){
  var r=recipeById(name);if(!r)return;
  var por=portions();
  var h='<span class="x" onclick="closeModal()">✕</span><h2>'+esc(r.n)+'</h2>';
  h+='<div class="row"><span class="badge">'+r.c+'</span><span class="badge">⏱ '+r.t+' мин</span><span class="badge">'+r.k+' ккал / порция</span>'+(r.oven?'<span class="badge">нужна духовка</span>':'')+'</div>';
  h+='<p style="margin:10px 0">'+esc(r.d)+'</p><h3>Ингредиенты (на '+por+' порции)</h3><ul style="padding-left:20px">';
  for(var i of r.ing)h+='<li>'+esc(i[0])+' — '+Math.ceil(i[1]*por)+' '+i[2]+'</li>';
  h+='</ul><h3>Как готовить</h3><ol>';
  for(var s of r.st)h+='<li>'+esc(s)+'</li>';
  h+='</ol><div class="row" style="margin-top:12px"><button data-act="printrecipe" data-v="'+esc(r.n)+'">🖨 Печать рецепта</button></div>';
  $("#mbox").innerHTML=h;$("#modal").classList.add("on");
}
function closeModal(){$("#modal").classList.remove("on")}

/* ---------- печать ---------- */
function printMenu(){
  var h='<h1>Меню на неделю</h1><table><tr><th>День</th><th>Завтрак</th><th>Обед</th><th>Ужин</th><th>Полдник</th></tr>';
  for(var d=0;d<7;d++){
    var g=function(c){var v=S.menu[d][c];return v?esc(v):"—"};
    h+='<tr><td><b>'+DAYS[d]+'</b></td><td>'+g("завтрак")+'</td><td>'+g("обед")+'</td><td>'+g("ужин")+'</td><td>'+g("полдник")+'</td></tr>';
  }
  h+='</table><p>Приятного аппетита!</p>';
  $("#prn").innerHTML=h;window.print();
}
function printShop(){
  var list=shopping(),h='<h1>Список покупок</h1><table><tr><th> </th><th>Продукт</th><th>Количество</th><th>Цена от</th></tr>';
  for(var it of list)h+='<tr><td>☐</td><td>'+esc(it.n)+'</td><td>× '+it.q+'</td><td>'+rub(it.price)+'</td></tr>';
  h+='</table>';
  $("#prn").innerHTML=h;window.print();
}
function printRecipe(name){
  var r=recipeById(name);if(!r)return;
  var por=portions();
  var h='<h1>'+esc(r.n)+'</h1><p><b>'+r.c+'</b> · '+r.t+' мин · '+r.k+' ккал/порция · на '+por+' порции</p>';
  h+='<table><tr><th>Продукт</th><th>Сколько</th></tr>';
  for(var i of r.ing)h+='<tr><td>'+esc(i[0])+'</td><td>'+Math.ceil(i[1]*por)+' '+i[2]+'</td></tr>';
  h+='</table><h3>Как готовить</h3><ol>';
  for(var s of r.st)h+='<li>'+esc(s)+'</li>';
  h+='</ol><p>Приятного аппетита!</p>';
  $("#prn").innerHTML=h;window.print();
}

/* ---------- события ---------- */
function bindChips(){
  var cs=document.querySelectorAll(".chip");
  for(var el of cs){
    el.onclick=function(){
      var type=this.getAttribute("data-chip"),v=this.getAttribute("data-v");
      var arr=null;
      if(type==="shop")arr=S.shops;if(type==="al")arr=S.allergies;if(type==="pr")arr=S.prefs;if(type==="have")arr=S.have;if(type==="appl")arr=S.appl;
      var i=arr.indexOf(v);
      if(i>=0)arr.splice(i,1);else arr.push(v);
      this.classList.toggle("on");save();
    };
  }
  var sel=document.querySelectorAll("select.dish");
  for(var s of sel){
    s.onchange=function(){
      S.menu[+this.getAttribute("data-day")][this.getAttribute("data-slot")]=this.value;save();
    };
  }
}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");
  if(!el)return;
  var act=el.getAttribute("data-act"),v=el.getAttribute("data-v");
  if(act==="next"){
    if(STEP===2)S.budget=+(($("#in-bud")||{}).value||S.budget);
    if(STEP===5){S.fam.ad=+(($("#f-ad")||{}).value||S.fam.ad);S.fam.kid=+(($("#f-kid")||{}).value||S.fam.kid);S.fam.bab=+(($("#f-bab")||{}).value||S.fam.bab);save();genMenu();go("menu");return}
    STEP++;save();render();window.scrollTo(0,0);
  }
  else if(act==="prev"){STEP--;save();render()}
  else if(act==="regen"){genMenu();render()}
  else if(act==="shop")go("shop");
  else if(act==="budget")go("budget");
  else if(act==="advice")go("advice");
  else if(act==="back")go("menu");
  else if(act==="open")openRecipe(v);
  else if(act==="printmenu")printMenu();
  else if(act==="printshop")printShop();
  else if(act==="printrecipe"){closeModal();setTimeout(function(){printRecipe(v)},50)}
});

/* ---------- старт ---------- */
if(S&&S.done&&S.menu){
  var okMenu=false;
  try{okMenu=S.menu.length===7&&S.menu.every(function(d){return d&&typeof d==="object"})}catch(e){}
  if(okMenu){go("menu")}else{S.done=false;go("wizard")}
}else{go("wizard")}
</script>
